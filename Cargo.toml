[package]
name = "gdbmtool-rs"
version = "0.1.0"
authors = ["Jeff Garzik"]
edition = "2024"
rust-version = "1.89"
license = "MIT"
readme = "README.md"
description = "Command line tools for GDBM databases, built on the pure-Rust gdbm-native crate"
repository = "https://github.com/jgarzik/gdbmtool-rs"
keywords = ["gdbm", "dbm", "database", "key-value", "cli"]
categories = ["command-line-utilities", "database"]
include = ["/src/**/*.rs", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
clap = { version = "4.6", features = ["derive", "cargo"] }
gdbm-native = { version = "0.9", features = ["diagnostic"] }
rustyline = "18"
shellwords = "1.1"
termsize = "0.1.9"

[[bin]]
name = "gdbmtool-rs"
path = "src/gdbmtool/main.rs"

[[bin]]
name = "gdbmdump-rs"
path = "src/dump.rs"


[dev-dependencies]
tempfile = "3.27"
